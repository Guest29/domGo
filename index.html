<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#333333" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ДомGo" />
  <meta name="format-detection" content="telephone=no" />
  <title>ДомGo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <main class="app" aria-label="ДомGo">
    <section class="camera-screen" aria-label="Камера">
      <div class="ar-layer" id="arLayer" aria-label="Камера распознавания">
        <a-scene
          id="arScene"
          embedded
          renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;"
          vr-mode-ui="enabled: false"
          arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.75; trackingMethod: best;">
          <a-marker id="domgoMarker" type="pattern" url="assets/domgo-marker.patt" smooth="true" smoothCount="6" smoothTolerance="0.02" smoothThreshold="2">
            <a-entity id="markerHouse" position="0 0 0" rotation="-90 0 0" scale="0.65 0.65 0.65">
              <a-box position="0 0.34 0" depth="1.12" height="0.68" width="1.24" color="#f15044" shadow="cast: true"></a-box>
              <a-box position="0 0.8 0" depth="1.2" height="0.16" width="1.36" color="#333333"></a-box>
              <a-box position="-0.32 0.39 -0.58" depth="0.04" height="0.22" width="0.2" color="#ffffff"></a-box>
              <a-box position="0.02 0.39 -0.58" depth="0.04" height="0.22" width="0.2" color="#ffffff"></a-box>
              <a-box position="0.36 0.39 -0.58" depth="0.04" height="0.22" width="0.2" color="#ffffff"></a-box>
              <a-box position="0 0.06 -0.61" depth="0.05" height="0.26" width="0.22" color="#333333"></a-box>
              <a-cylinder position="0 -0.02 0" radius="0.78" height="0.03" color="#000000" opacity="0.22"></a-cylinder>
            </a-entity>
          </a-marker>
          <a-entity camera></a-entity>
        </a-scene>
      </div>

      <video id="demoVideo" class="camera-layer demo-video is-hidden" muted playsinline webkit-playsinline preload="metadata" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" aria-label="Демо-ролик"></video>
      <canvas id="scanCanvas" class="scan-canvas" aria-hidden="true"></canvas>
      <div class="camera-vignette" aria-hidden="true"></div>

      <header class="minimal-topbar" aria-label="Верхняя панель">
        <img src="assets/logo-domgo.png" alt="ДомGo" class="brand-logo" draggable="false" />
      </header>

      <p class="scan-status" id="scanStatus" aria-live="polite">Наведите камеру на объект</p>

      <button class="demo-launch-button" id="startDemoButton" type="button">Запустить демо</button>

      <section class="demo-panel is-hidden" id="demoPanel" aria-label="Демо-ролики">
        <span class="demo-panel-title">Демо-ролики</span>
        <div class="demo-panel-buttons">
          <button class="demo-button" type="button" data-demo="0">Ролик 1</button>
          <button class="demo-button" type="button" data-demo="1">Ролик 2</button>
          <button class="demo-button" type="button" data-demo="2">Ролик 3</button>
        </div>
        <button class="demo-camera-button" id="returnCameraButton" type="button">К камере</button>
      </section>

      <section class="found-panel is-hidden" id="foundPanel" aria-live="polite" aria-label="Найденный дом"></section>
    </section>

    <section class="full-ui" id="fullUi" aria-hidden="true" aria-label="Меню дома">
      <div class="full-ui-bg" aria-hidden="true"></div>
      <div class="full-ui-content" id="fullUiContent">
        <header class="ui-header">
          <img src="assets/logo-domgo.png" alt="ДомGo" class="ui-logo" draggable="false" />
          <button class="ghost-button" id="closeFullUi" type="button">Закрыть</button>
        </header>
        <div id="buildingContent"></div>
      </div>
    </section>

    <section class="apartment-drawer" id="apartmentDrawer" aria-hidden="true">
      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <article class="drawer-card" id="drawerCard"></article>
    </section>

    <section class="ai-panel" id="aiPanel" aria-hidden="true">
      <div class="ai-backdrop" id="aiBackdrop"></div>
      <article class="ai-card">
        <header class="ai-header">
          <img src="assets/logo-domgo.png" alt="ДомGo" class="ai-logo" draggable="false" />
          <button class="ghost-button" id="closeAi" type="button">Закрыть</button>
        </header>
        <p class="ai-kicker">Обзор от ИИ</p>
        <h2>Анализ релевантности квартиры</h2>
        <div class="ai-output" id="aiOutput" aria-live="polite"></div>
      </article>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
